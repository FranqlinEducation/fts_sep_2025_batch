<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalog - Franqlin Tech Systems</title>
    <link rel="stylesheet" href="product.css">
</head>
<body>
<header>
    <div class="logo">
        <img src="https://cdn-icons-png.flaticon.com/512/5968/5968292.png" alt="logo">
        <h2>Franqlin Tech Systems</h2>
    </div>
    <nav>
        <a href="#">Home</a>
        <a href="#" class="active">Products</a>
        <a href="#">About Us</a>
        <a href="#">Contact</a>
        <div class="icons">
            <i class="fa fa-search"></i>
            <i class="fa fa-shopping-cart"></i>
            <img src="https://cdn-icons-png.flaticon.com/512/847/847969.png" alt="user" class="user-icon">
        </div>
    </nav>
</header>

<main>
    <h1>Product Catalog</h1>

    <div class="table-container">
        <table id="productTable">
            <thead>
            <tr>
                <th>PRODUCT NAME</th>
                <th>PRICE</th>
                <th>QUANTITY</th>
                <th>AVAILABILITY</th>
            </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</main>

<script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
<script src="product.js"></script>
</body>
</html>
